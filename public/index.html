<!doctype html><html lang="vi"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.rndbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px}
.rndbar>span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-right:auto}
.stp{display:flex;align-items:center;border:1.5px solid var(--bark);border-radius:999px;background:var(--paper);overflow:hidden}
.stp button{width:32px;height:30px;border:0;background:none;font-size:18px;font-weight:800;color:var(--ink)}.stp button:disabled{opacity:.3}
.stp b{min-width:28px;text-align:center;font-size:15px}
.rndgo{height:32px;padding:0 12px;border:1.5px solid var(--bark);border-radius:999px;background:#F2D27A;font-weight:800;font-size:13px;color:var(--ink)}
.mimabar{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(155,89,182,.18);border:1.5px solid #B57EDC;color:#F1E4FA;font-size:14px}
.mimabar small{display:block;margin-top:2px;font-size:12px;opacity:.85}
.mimaalert{margin:14px 0 6px;padding:14px 16px;border-radius:12px;background:#6C3483;color:#fff;border:3px solid #D7B3F0;box-shadow:0 0 0 4px rgba(155,89,182,.35);animation:sealpulse 1.2s ease-in-out 2}
.mimaalert .big{font-size:22px;font-weight:900;letter-spacing:.04em}.mimaalert p{margin:6px 0 0;font-size:14px;line-height:1.45}.mimaalert .real{background:rgba(0,0,0,.25);padding:6px 8px;border-radius:8px}
.num.stused,.num.stused:disabled{opacity:1!important;filter:grayscale(1)!important;background:repeating-linear-gradient(135deg,#6B7479 0 6px,#5A6267 6px 12px)!important;color:#EEF2F4!important;border:2px solid #B9C4CA!important;box-shadow:0 0 0 3px #8E9AA1!important}
.num.stused .mmb{background:#4F585D!important;border-color:#D5DDE1!important}
.num.stused small{color:#E3E9EC!important;opacity:1!important}
.num.mmA,.num.mmB,.num.mmused{box-shadow:0 0 0 3px #B57EDC,0 0 14px rgba(181,126,220,.8)!important}
.num.mmB{box-shadow:0 0 0 3px #F5C04A,0 0 14px rgba(245,192,74,.8)!important}
.num.mmused:disabled{opacity:.95!important;background:#4A2560!important;color:#F1E4FA!important;filter:none!important}
.num.mmused small{color:#E8D2F7!important;opacity:1!important}
.num .mmb{position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#6C3483;border:2px solid #D7B3F0;display:grid;place-items:center;font-size:11px;font-style:normal;z-index:3}
.num.mmB .mmb{background:#8A6110;border-color:#F5C04A}
.afkbtn{margin-left:auto;margin-right:8px;height:34px;padding:0 12px;border-radius:999px;border:2px solid #C0392B;background:#FBE3DE;color:#8E1E14;font-weight:900;font-size:13px;letter-spacing:.06em}
.afkbtn[hidden]{display:none}
.num .stb{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#5E6B73;border:2px solid #D5DDE1;display:grid;place-items:center;font-size:12px;font-style:normal;z-index:3}
.num .afkb{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);padding:1px 6px;border-radius:999px;background:#C0392B;color:#fff;font:900 9px/14px var(--body);letter-spacing:.05em;font-style:normal;border:1.5px solid #fff;z-index:3}
</style>
<title>Quản Trò Đạo Lý</title>
<meta name="description" content="Công cụ điều hành ván Ma Sói cho quản trò Thị Trấn Đạo Lý: gọi vai ban đêm, kiểm phiếu, bầu Thị trưởng, bấm giờ phát biểu.">
<meta name="theme-color" content="#0F1A2C">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quản Trò">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&subset=vietnamese&display=swap">
</head><body>
<style>
/* Layout: một cột kiểu sổ tay quản trò; ngày nền giấy da, đêm chuyển sang nền gỗ tối như mặt sau lá bài. Giao diện một chủ đề theo nhận diện Thị Trấn Đạo Lý. */
:root{
  --parch:#F8EFB5; --paper:#FEFCF5; --ink:#2B1810; --bark:#3E2723; --mute:#7A6450;
  --gold:#C9A24A; --gold-soft:#E7CF8E; --night:#1C120D; --night2:#2B1D15; --night-line:#4A3427;
  --wolf:#9A2E21; --village:#2F5A86; --ok:#3F6B3A;
  --display:'Roboto Slab','Noto Serif',Georgia,serif; --body:'Quicksand','Segoe UI',system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--parch);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;transition:background .35s,color .35s}
body.night{background:var(--night);color:var(--parch);color-scheme:dark}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:6px;padding:12px 0;background:var(--parch);border-bottom:2px solid var(--bark);transition:background .35s}
body.night .top{background:var(--night);border-color:var(--night-line)}
.brand{font:15px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;overflow:hidden;text-overflow:ellipsis;font:600 11px/1.3 var(--body);letter-spacing:.12em;color:var(--mute);margin-top:3px}
body.night .brand small{color:var(--gold-soft)}
.tbtn{border:2px solid currentColor;background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.tbtn[disabled]{opacity:.3;cursor:default}
/* tiêu đề */
h1{font:400 30px/1.1 var(--display);margin:22px 0 6px;text-wrap:balance}
.lead{color:var(--mute);margin:0 0 18px;max-width:40ch}
body.night .lead{color:var(--gold-soft)}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--village)}
body.night .eyebrow{color:var(--gold)}
/* nút chính */
.dock{position:fixed;left:0;right:0;bottom:0;padding:22px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--parch) 20px);z-index:9}
body.night .dock{background:linear-gradient(transparent,var(--night) 20px)}
.dock .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.dock .hint{font-size:13px;font-weight:600;text-align:center;color:var(--wolf)}
body.night .dock .hint{color:var(--gold-soft)}
.cta{width:100%;border:2px solid var(--bark);background:var(--bark);color:var(--parch);border-radius:10px;padding:16px;font:20px/1 var(--display);box-shadow:4px 4px 0 var(--ink);transition:transform .08s}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.cta[disabled]{opacity:.4;cursor:default;box-shadow:none}
body.night .cta{background:var(--gold);color:var(--night);border-color:var(--gold);box-shadow:4px 4px 0 #000}
/* bước 1: số người */
.big{display:flex;align-items:center;justify-content:center;gap:18px;margin:26px 0 18px}
.big output{font:700 88px/1 var(--mono);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.round{width:58px;height:58px;border-radius:50%;border:2px solid var(--bark);background:var(--paper);font:700 28px/1 var(--mono);box-shadow:3px 3px 0 var(--ink)}
.round[disabled]{opacity:.3;box-shadow:none}
.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chip{border:2px solid var(--bark);background:var(--paper);border-radius:8px;padding:10px 0;font:700 16px/1 var(--mono)}
.chip.on{background:var(--bark);color:var(--parch)}
/* bước 2: vai */
.tally{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:8;background:var(--paper);border:2px solid var(--bark);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px}
.tally b{font:700 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.tally .bar{flex:1;height:8px;border-radius:4px;background:#EADFB0;overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--village)}
.tally.full .bar i{background:var(--ok)}.tally.over .bar i{background:var(--wolf)}
.tally .sub{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.side{margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.side h2{font:400 21px/1 var(--display);margin:0}
.side.tot h2{color:var(--village)}.side.soi h2{color:var(--wolf)}
.side span{font:600 13px var(--body);color:var(--mute)}
.rlist{display:flex;flex-direction:column;border:2px solid var(--bark);border-radius:10px;background:var(--paper);overflow:hidden}
.ritem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #E6DAB0}
.ritem:first-child{border-top:0}
.ritem .info{flex:1;min-width:0}
.ritem .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ritem .ds{font-size:13px;color:var(--mute);margin-top:2px;display:none}
.ritem.open .ds{display:block}
.tag{font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:#F0E3B0;color:var(--bark)}
.tag.warn{background:#F6D9C9;color:var(--wolf)}
.qi{border:0;background:none;color:var(--mute);font-weight:700;font-size:12px;padding:2px 0;text-decoration:underline}
.sw{width:50px;height:30px;border-radius:15px;border:2px solid var(--bark);background:#EADFB0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bark);transition:left .15s}
.sw.on{background:var(--village)}.soi .sw.on,.sw.on.w{background:var(--wolf)}
.sw.on::after{left:23px;background:var(--paper)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:36px;height:36px;border-radius:8px;border:2px solid var(--bark);background:var(--paper);font:700 18px/1 var(--mono)}
.step b{min-width:2ch;text-align:center;font:700 18px var(--mono)}
.fill{margin-top:10px;border:2px dashed var(--bark);background:transparent;border-radius:8px;padding:9px 12px;font-weight:700;font-size:14px;width:100%}
/* bước 3: đêm */
.prog{display:flex;gap:3px;margin:16px 0 4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--night-line)}
.prog i.d{background:var(--gold);opacity:.45}.prog i.n{background:var(--gold)}
.progtx{display:flex;justify-content:space-between;font:700 12px var(--mono);color:var(--gold-soft);letter-spacing:.04em}
.card{position:relative;margin-top:16px;background:var(--night2);border:1px solid var(--gold);outline:1px solid var(--night-line);outline-offset:4px;border-radius:14px;padding:22px 18px 18px}
.card::before,.card::after{content:"✦";position:absolute;color:var(--gold);font-size:13px;top:8px;left:10px}
.card::after{left:auto;right:10px}
.card .side-lb{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase}
.card .side-lb.tot{color:#8FB4DA}.card .side-lb.soi{color:#E58A78}
.card h1{margin:10px 0 8px;font-size:36px;color:var(--parch)}
.card .act{color:var(--gold-soft);margin:0;font-size:16px}
.block{margin-top:18px}
.block h3{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.block h3 span{color:var(--gold-soft);letter-spacing:.04em;text-transform:none;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.num{aspect-ratio:1;max-width:100%;border-radius:10px;border:1.5px solid var(--night-line);background:var(--night);color:var(--parch);font:700 22px/1 var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.num small{font:600 9px/1 var(--body);color:var(--gold-soft);max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.num.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
.num.on small{color:var(--night)}
.num.taken{opacity:.35}
.num.dead{opacity:.25;text-decoration:line-through}
.num[disabled]{cursor:default}
.note{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:14px;background:#3A271C;color:var(--gold-soft);border-left:3px solid var(--gold)}
.note.bad{border-left-color:#E58A78}
.note b{color:var(--parch)}
.result{margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--night);border:1.5px solid var(--gold)}
.result .r{font:400 26px/1 var(--display)}
.result .r.soi{color:#E58A78}.result .r.tot{color:#8FB4DA}
.result small{color:var(--gold-soft);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--night-line);background:var(--night);border-radius:10px;padding:12px 6px;font-weight:700;font-size:14px}
.seg button.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
.seg button[disabled]{opacity:.3;cursor:default}
.skip{margin-top:10px;width:100%;border:1.5px dashed var(--gold);background:transparent;color:var(--gold-soft);border-radius:10px;padding:13px;font-weight:700;font-size:15px}
.skip.on{background:var(--gold);color:var(--night);border-style:solid}
.next-up{margin-top:14px;display:flex;justify-content:space-between;font-size:13px;color:var(--gold-soft);padding:0 2px}
.next-up b{color:var(--parch)}
/* sáng */
.dawn{margin-top:22px;text-align:center;padding:28px 16px;border:2px solid var(--bark);border-radius:14px;background:var(--paper);box-shadow:4px 4px 0 var(--ink)}
.dawn .k{font:700 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.dawn h1{font-size:30px;margin:12px 0}
.deaths{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:6px}
.deaths span{width:64px;height:64px;border-radius:12px;background:var(--wolf);color:var(--paper);font:700 30px/64px var(--mono);text-align:center}
.winner{font:400 40px/1.1 var(--display);margin:14px 0 4px}
.win.soi .winner{color:var(--wolf)}.win.tot .winner{color:var(--village)}
.winbar{margin-top:18px;padding:12px 14px;border-radius:10px;font-weight:700;text-align:center;color:var(--paper);background:var(--village)}
.winbar.soi{background:var(--wolf)}
.peace{font:400 40px/1.1 var(--display);color:var(--ok);margin:14px 0 4px}
details.gm{margin-top:16px;border:2px solid var(--bark);border-radius:10px;background:var(--paper)}
details.gm summary{padding:12px 14px;font-weight:700;cursor:pointer}
details.gm ul{margin:0;padding:0 16px 14px 32px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.gmsec h4{margin:4px 14px 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--village)}
.gmsec ul{padding-bottom:8px!important}
.gmsec li.memo{color:var(--wolf);font-weight:600}
details.gmold{margin:0 14px 10px;border:1.5px dashed rgba(62,39,35,.35);border-radius:12px}
details.gmold summary{padding:8px 12px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
.gmmemo{display:block;width:calc(100% - 28px);margin:0 14px 14px;border:1.5px solid var(--bark);border-radius:12px;background:#FFFDF6;padding:10px 12px;font:500 16px/1.4 var(--body);color:var(--ink);resize:vertical;outline:none}
.gmmemo:focus{box-shadow:0 0 0 3px rgba(212,175,55,.35)}
/* ngày */
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dnum{aspect-ratio:1;border-radius:10px;border:2px solid var(--bark);background:var(--paper);font:700 22px/1 var(--mono)}
.dnum.on{background:var(--wolf);border-color:var(--wolf);color:var(--paper)}
.mayorbox{margin-top:22px;padding:14px;border:2px solid var(--village);border-radius:12px;background:var(--paper)}
.mayorbox h3{font:400 20px var(--display);margin:0 0 4px;color:var(--village)}
.mayorbox p{margin:0 0 12px;color:var(--mute)}
.tear{margin-top:10px;width:100%;border:2px dashed var(--wolf);background:transparent;color:var(--wolf);border-radius:10px;padding:12px;font-weight:700}
.tear.on{background:var(--wolf);color:var(--paper);border-style:solid}
.dnum.may{background:var(--village);border-color:var(--village);color:var(--paper)}
.dnum.dead{opacity:.25;text-decoration:line-through}
.hintbox{margin-top:12px;font-size:14px;background:var(--paper);border:2px dashed var(--bark);border-radius:10px;padding:10px 12px}
/* bảng số */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(20,12,8,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{width:100%;max-width:480px;max-height:85%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:400 22px var(--display);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 6px;border-top:1px solid #E6DAB0;vertical-align:top}
.tbl td:first-child{font:700 16px var(--mono);width:3ch}
.tbl tr.x td{opacity:.4;text-decoration:line-through}
.tbl .w{color:var(--wolf);font-weight:700}.tbl .t{color:var(--village);font-weight:700}
.st{display:inline-block;margin:2px 4px 0 0;font-size:11px;font-weight:700;padding:2px 5px;border-radius:4px;background:#F0E3B0}
.danger{margin-top:16px;width:100%;border:2px solid var(--wolf);color:var(--wolf);background:transparent;border-radius:10px;padding:12px;font-weight:700}
.tbtn.warn{background:var(--wolf);border-color:var(--wolf);color:var(--paper)}
.tbtn[hidden]{display:none}
/* số bị khóa vì đã chọn đêm trước (Bảo vệ, Phong Ấn) */
.num.lock{opacity:1;border:2px solid #E58A78;color:#E58A78;background:repeating-linear-gradient(135deg,#2A1712 0 6px,#3A1D16 6px 12px);position:relative}
.num.lock::after{content:"✕";position:absolute;top:3px;right:5px;font:700 11px/1 var(--body);color:#E58A78}
.num.lock small{color:#E58A78;font-weight:700}
/* Kỵ sĩ */
.knightbox{margin:0 0 18px;padding:14px;border:2px solid var(--bark);border-radius:12px;background:var(--paper)}
.knightbox h3{font:400 20px var(--display);margin:0 0 4px}
.knightbox p{margin:0 0 12px;color:var(--mute)}
.knightbox.done p{margin:0;color:var(--ink)}
.knightbox.hit{border-color:var(--ok)}.knightbox.hit h3{color:var(--ok)}
.knightbox.miss{border-color:var(--wolf)}.knightbox.miss h3{color:var(--wolf)}
.dnum.stab{background:var(--bark);border-color:var(--bark);color:var(--paper)}
.kgo{margin-top:10px;width:100%;border:2px solid var(--bark);background:var(--bark);color:var(--parch);border-radius:10px;padding:12px;font-weight:700}
.kgo[disabled]{opacity:.4;cursor:default}
/* bước 1: tên người chơi */
.pmeta{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
.pmeta b{font:700 34px/1 var(--mono);font-variant-numeric:tabular-nums}
.pmeta span{font-weight:600;color:var(--mute)}
.plist{display:flex;flex-direction:column;border:2px solid var(--bark);border-radius:10px;background:var(--paper);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid #E6DAB0}
.prow:first-child{border-top:0}
.pno{flex:none;width:38px;height:38px;border-radius:8px;border:2px solid #CBBE93;color:#A8997A;display:flex;align-items:center;justify-content:center;font:700 18px/1 var(--mono)}
.prow.has .pno{background:var(--bark);border-color:var(--bark);color:var(--parch)}
.prow input{flex:1;min-width:0;border:0;background:transparent;font:600 16px var(--body);color:var(--ink);padding:10px 4px;outline:none}
.prow input::placeholder{color:#B8AA88;font-weight:500}
.prow:focus-within{background:#FBF4D6}
/* reset setup vai */
.h1row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.resetbtn{flex:none;margin-top:24px;border:2px solid var(--wolf);color:var(--wolf);background:transparent;border-radius:8px;padding:7px 10px;font-weight:700;font-size:14px}
.resetbtn:active{background:var(--wolf);color:var(--paper)}
/* tên trong ô số */
.dnum{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.dnum small{font:600 9px/1 var(--body);max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.8}
.pn{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.02em}
/* phong ấn: thanh báo suốt đêm */
.sealbar{margin-top:14px;padding:12px 14px;border-radius:12px;background:#4A1A12;border:2px solid #E58A78;color:var(--parch);font-size:15px;font-weight:600}
.sealbar b{color:#FFB8A8}
.sealbar small{display:block;margin-top:4px;font-size:13px;color:var(--gold-soft);font-weight:600}
.num.sealed{border:2px dashed #E58A78}
.num.on.sealed{background:#C0392B;color:#fff;border:2px solid #FFB8A8}
.num.on.sealed small{color:#fff}
.pupalert{margin:16px 0 4px;padding:16px;border-radius:12px;background:#5B2A86;color:#fff;border:3px solid #C9A7EB;animation:sealpulse 1.2s ease-in-out 2}
.pupalert .big,.voidalert .big{font:400 26px/1.1 var(--display);margin-bottom:8px}
.pupalert p,.voidalert p{margin:6px 0 0;font-size:15px;line-height:1.4}
.voidalert{margin:12px 0;padding:16px;border-radius:12px;background:#C0392B;color:#fff;border:3px solid #FFB8A8}
.sealalert{margin:16px 0 4px;padding:16px;border-radius:12px;background:#C0392B;color:#fff;border:3px solid #FFB8A8;box-shadow:0 0 0 4px rgba(192,57,43,.35);animation:sealpulse 1.2s ease-in-out 2}
.stonealert{background:#5E6B73;border-color:#D5DDE1;box-shadow:0 0 0 4px rgba(94,107,115,.4)}
.sealalert .big{font:400 26px/1.1 var(--display);letter-spacing:.02em;margin-bottom:8px}
.sealalert p{margin:6px 0 0;font-size:15px;line-height:1.4}
@keyframes sealpulse{50%{box-shadow:0 0 0 10px rgba(192,57,43,.15)}}
.sealtag{font:700 12px var(--body);color:#FF9C88;white-space:nowrap}
/* ban đêm: vai dưới mỗi ô số, phe Sói nổi bật */
.num{position:relative}
.num.tall{aspect-ratio:auto;min-height:76px;padding:6px 2px;gap:2px}
.num small.rl{font-weight:700;color:#8FB4DA;white-space:normal;line-height:1.1;text-align:center;overflow:visible}
.num.lock small{white-space:normal;line-height:1.1;text-align:center}
.num.wolf{border:2px solid #E58A78;background:#3A1712}
.num.wolf small.rl{color:#FF9C88}
.num.wolf::before{content:"🐺";position:absolute;top:3px;left:4px;font-size:11px;line-height:1}
.num.on small.rl{color:var(--night)}
.num.on.wolf{background:var(--gold);border-color:#C0392B;box-shadow:inset 0 0 0 2px #C0392B}
.num.on.wolf small.rl{color:#8E1B10}
/* ban ngày: còn trên bàn */
.alivebox{margin:0 0 18px;border:2px solid var(--bark);border-radius:12px;background:var(--paper);overflow:hidden}
.alivebox .ahead{padding:10px 12px;background:var(--bark);color:var(--parch);font-weight:700}
.alivebox .ahead b{font:700 22px/1 var(--mono);margin-right:4px}
.alivebox .ahead span{font-weight:600;font-size:12px;opacity:.8}
.arow{display:grid;grid-template-columns:52px 52px 1fr;align-items:baseline;gap:6px;padding:8px 12px;border-top:1px solid #E6DAB0}
.arow b{font:700 20px/1 var(--mono);text-align:center}
.arow span{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.arow em{font-style:normal;font-size:13px;color:var(--ink)}
.arow.than b,.arow.than span{color:var(--village)}.arow.dan b,.arow.dan span{color:var(--ok)}.arow.soi b,.arow.soi span{color:var(--wolf)}
/* ban ngày: vai dưới mỗi ô số */
.dnum.tall{aspect-ratio:auto;min-height:72px;padding:6px 2px}
.dnum small.rl{font-weight:700;color:var(--village);opacity:1;white-space:normal;line-height:1.15;text-align:center;overflow:visible}
.dnum small.rl.w{color:var(--wolf)}
.dnum.on small.rl,.dnum.on small.rl.w{color:var(--paper)}
.rolebtn{width:100%;margin:0 0 14px;border:2px dashed var(--bark);background:transparent;border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.rolebtn.on{border-style:solid;background:var(--bark);color:var(--parch);margin-bottom:0;border-radius:10px 10px 0 0}
.roster{margin:0 0 18px;border:2px solid var(--bark);border-top:0;border-radius:0 0 10px 10px;background:var(--paper);padding:2px 12px 6px}
.roster .tbl tr:first-child td{border-top:0}
.stonebox{margin:0 0 16px;padding:14px 16px;border-radius:12px;background:#5E6B73;color:#fff;border:3px solid #B9C4CA}
.stonebox .big{font:400 24px/1.15 var(--display);margin-bottom:6px}
.stonebox p{margin:0;font-size:15px;line-height:1.4}
.arow.vote{background:#FBF4D6}.arow.vote b,.arow.vote span{color:var(--bark)}
/* chọn set */
.setbox{margin:0 0 14px;padding:12px;border:2px solid var(--bark);border-radius:12px;background:var(--paper)}
.setbox h3{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--village);margin:2px 0 10px}
.setbox p{margin:10px 0 0;font-size:13px;color:var(--mute)}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.setchip{border:1.5px solid var(--bark);background:transparent;border-radius:8px;padding:9px 8px;font-weight:700;font-size:13px;line-height:1.2;text-align:left}
.setchip.on{background:var(--village);border-color:var(--village);color:var(--paper)}
.rulebox{margin:0 0 14px;padding:12px;border:2px dashed var(--wolf);border-radius:12px;background:var(--paper)}
.rulebox h3{font:700 13px/1.3 var(--body);margin:0 0 8px;color:var(--wolf)}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg2 button{border:1.5px solid var(--bark);background:transparent;border-radius:8px;padding:9px 8px;font-weight:700;font-size:13px;text-align:left}
.seg2 button small{display:block;font-weight:600;font-size:11px;margin-top:3px;opacity:.75}
.seg2 button.on{background:var(--wolf);border-color:var(--wolf);color:var(--paper)}
.jailrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.jailrow b{flex:none;width:58px;color:var(--parch)}
.jailrow .seg{flex:1;grid-template-columns:repeat(2,minmax(0,1fr))}
.pulled{margin:12px 0 0;font-weight:700;color:var(--wolf)}
.skip[disabled]{opacity:.35;cursor:default}
/* tổng kết ván */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{border:2px solid var(--bark);border-radius:10px;background:var(--paper);padding:10px 6px;text-align:center}
.stat b{display:block;font:700 24px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--mute)}
.stat.than b{color:var(--village)}.stat.dan b{color:var(--ok)}.stat.soi b{color:var(--wolf)}
.rbox{border:2px solid var(--bark);border-radius:10px;background:var(--paper);padding:4px 12px}
.tbl.rev td{vertical-align:middle}
.tbl.rev tr:first-child td{border-top:0}
.tbl.rev td:nth-child(2){width:56px}
.grp{display:inline-block;min-width:46px;text-align:center;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 6px;border-radius:5px;color:var(--paper)}
.grp.than{background:var(--village)}.grp.dan{background:var(--ok)}.grp.soi{background:var(--wolf)}
.fate{font-size:12px;color:var(--mute);margin-top:3px}
.tbl.rev tr.dd td:first-child{opacity:.45;text-decoration:line-through}
.tbl.rev tr.dd .fate{color:var(--wolf);font-weight:600}
.tlbox{padding:4px 12px 14px}
.tlg h3{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--village);margin:14px 0 8px}
.tlg ul{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--gold);display:flex;flex-direction:column;gap:6px;font-size:14px}
.tlg li.die{color:var(--wolf);font-weight:700}
.tlg li.calm{color:var(--ok);font-weight:700}
.dn{display:inline-block;min-width:26px;padding:2px 5px;margin-right:6px;border-radius:5px;background:var(--wolf);color:var(--paper);font:700 13px/1.2 var(--mono);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* bấm giờ phát biểu */
.tmbtn{position:relative;padding:6px 8px}
.tmbtn span{position:absolute;top:-8px;right:-8px;min-width:22px;padding:2px 4px;border-radius:10px;background:var(--wolf);color:#fff;font:700 11px/1.2 var(--mono)}
.tmbtn span:empty{display:none}
.tm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:448px;z-index:20;background:var(--paper);color:var(--ink);border:2px solid var(--bark);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px}
.tm[hidden]{display:none}
.tm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tm-head button{border:0;background:none;font-weight:700;color:var(--mute);padding:4px}
.tm-presets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tm-presets button{font-size:14px!important;padding:10px 0!important}
.tm-presets button{border:2px solid var(--bark);background:var(--paper);border-radius:10px;padding:10px 0;font:700 16px/1 var(--mono)}
.tm-presets button.on{background:var(--bark);color:var(--parch)}
.tm-face{position:relative;width:100%;margin-top:10px;border:2px solid var(--bark);border-radius:12px;background:#FBF4D6;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.tm-face span{font:700 64px/1 var(--mono);font-variant-numeric:tabular-nums}
.tm-face small{font-size:12px;font-weight:700;color:var(--mute);margin-top:4px}
.tm-face i{position:absolute;left:0;bottom:0;height:6px;background:var(--village);transition:width .2s linear}
.tm.warn .tm-face{background:#FBE9C8;border-color:#C98A1E}.tm.warn .tm-face i{background:#C98A1E}
.tm.last .tm-face{background:#F8E7E2;border-color:var(--wolf);animation:tmpulse 1s steps(1) infinite}.tm.last .tm-face span{color:var(--wolf)}.tm.last .tm-face i{background:var(--wolf)}
.tm.done .tm-face{background:var(--wolf);border-color:var(--wolf)}.tm.done .tm-face span,.tm.done .tm-face small{color:#fff}
@keyframes tmpulse{50%{background:#F2CFC6}}
.tm-ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tm-ctl button{border:2px solid var(--bark);background:var(--bark);color:var(--parch);border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.tm-ctl button:last-child{background:transparent;color:var(--bark)}
.tm-ctl button[disabled]{opacity:.35}
.tm-tip{margin:8px 0 0;font-size:12px;color:var(--mute)}
.tm-snd{margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tm-snd>span{font-size:12px;font-weight:700;color:var(--mute);width:100%}
.tm-snd #tmsnd{display:flex;gap:6px;flex:1}
.tm-snd #tmsnd button,.tm-snd>button{border:1.5px solid var(--bark);background:var(--paper);border-radius:8px;padding:8px 6px;font-weight:700;font-size:12px;flex:1;white-space:nowrap}
.tm-snd #tmsnd button.on{background:var(--bark);color:var(--parch)}
.tm-snd>button{flex:none;border-style:dashed}
/* setup vai: tìm kiếm + nhóm */
.rsearch{position:relative;margin:4px 0 12px}
.rsearch input{width:100%;border:2px solid var(--bark);border-radius:10px;background:var(--paper);padding:12px 40px 12px 12px;font:600 16px var(--body);color:var(--ink);outline:none;-webkit-appearance:none}
.rsearch input:focus{box-shadow:0 0 0 3px var(--gold-soft)}
.rsearch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px;color:var(--mute)}
.rsearch button[hidden]{display:none}
.rgrp{margin:0 0 12px;border:2px solid var(--bark);border-radius:12px;background:var(--paper);overflow:hidden}
.rgrp summary{list-style:none;display:block;padding:12px;cursor:pointer}
.rgh{display:flex;align-items:baseline;gap:8px}
.rgrp summary::-webkit-details-marker{display:none}
.rgt{font:400 21px/1 var(--display)}.rgrp.tot .rgt{color:var(--village)}.rgrp.soi .rgt{color:var(--wolf)}
.rgc{flex:1;font-size:13px;font-weight:600;color:var(--mute)}
.rgi{transition:transform .15s;font-weight:700}.rgrp[open] .rgi{transform:rotate(180deg)}
.rgon{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rgon em{font-size:13px;color:var(--mute)}
.rchip{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;color:var(--paper)}
.rchip.tot{background:var(--village)}.rchip.soi{background:var(--wolf)}
.rgrp .rlist{border:0;border-top:2px solid var(--bark);border-radius:0}
.ritem[hidden]{display:none}.rgrp[hidden]{display:none}
.rnone{text-align:center;color:var(--mute);font-weight:600}
/* bấm giờ ban đêm */
.ntimer{margin-top:14px;width:100%;border:1.5px solid var(--gold);background:transparent;color:var(--gold);border-radius:10px;padding:12px;font-weight:700;font-size:16px}
.ntimer:active{background:var(--gold);color:var(--night)}
.ntnote{margin:6px 0 0;font-size:13px;color:var(--gold-soft)}
.vcall{margin:0 0 12px;padding:12px;border-radius:10px;background:var(--village);color:var(--paper);font:600 17px/1.35 var(--display)}
/* ảnh kết quả */
.shotbtn{width:100%;margin-top:16px;border:2px solid var(--bark);background:var(--gold);color:var(--ink);border-radius:12px;padding:14px;font:700 17px var(--body);box-shadow:3px 3px 0 var(--ink)}
.shotbtn small{display:block;font-size:12px;font-weight:600;margin-top:2px;opacity:.8}
.lastbtn{background:var(--paper);font-size:15px;padding:10px}
.shot{position:fixed;inset:0;z-index:40;background:rgba(20,12,8,.75);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.shot[hidden]{display:none}
.shotpane{width:100%;max-width:480px;background:var(--paper);border-radius:14px;padding:14px}
.shothead{display:flex;justify-content:space-between;align-items:center}
.shothead b{font:600 18px var(--display)}
.shothead button{border:0;background:none;font-weight:700;color:var(--mute);padding:6px}
.shottip{margin:6px 0 10px;font-size:13px;color:var(--mute)}
.shotpane img{width:100%;border-radius:8px;border:1px solid var(--line,#E6DAB0);display:block;-webkit-touch-callout:default}
.shotbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shotbtns a,.shotbtns button{display:block;text-align:center;text-decoration:none;border:2px solid var(--bark);border-radius:10px;padding:12px;font-weight:700;font-size:15px;background:var(--bark);color:var(--parch)}
.shotbtns button{background:transparent;color:var(--bark)}
.shotbtns button[hidden]{display:none}
/* MVP / SVP */
.awrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.awcard{border:2px solid var(--bark);border-radius:10px;background:var(--paper);padding:10px;text-align:center;border-top-width:6px}
.awcard.mvp{border-top-color:var(--gold)}.awcard.svp{border-top-color:#9AA4AB}
.awcard span{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.awcard b{display:block;font:700 24px/1.2 var(--body);margin-top:4px}
.awcard em{display:block;font-style:normal;font-size:13px;color:var(--mute)}
.awtip{margin:8px 0 0;font-size:13px;color:var(--mute)}
.awd{margin-top:6px;border:1.5px solid var(--bark);background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.awd.mvp.on{background:var(--gold);border-color:var(--gold)}.awd.svp.on{background:#9AA4AB;border-color:#9AA4AB;color:#fff}
.st.mvpt{background:var(--gold)}.st.svpt{background:#9AA4AB;color:#fff}
.tbl.rev tr.is-mvp td{background:#FBF1D2}.tbl.rev tr.is-svp td{background:#EEF1F3}
.tbl.rev tr.dd.is-mvp td,.tbl.rev tr.dd.is-svp td{text-decoration:none}
/* kiểm phiếu */
.wf{border-color:var(--wolf)!important;border-width:2.5px!important;position:relative}
.wf::before{content:"🐺";position:absolute;top:3px;left:4px;font-size:11px;line-height:1}
.dnum.wf:not(.vt):not(.may),.vtab.wf:not(.on){background:#FBEAE5}
.wline{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:#F8E7E2;border-left:4px solid var(--wolf);font-size:14px;color:var(--wolf)}
.mtoggle{width:100%;margin-top:26px;border:2px dashed var(--village);background:transparent;color:var(--village);border-radius:10px;padding:12px;font-weight:700;font-size:15px;text-align:left}
.vhist h4{font:700 13px/1.3 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--village);margin:12px 0 6px}
.vhist h4 span{text-transform:none;letter-spacing:0;color:var(--wolf)}
.vhist ul{margin:0 0 4px;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.vhist ul.tl{margin-bottom:6px}
.vrl{margin:4px 0 4px!important;font-weight:700;font-size:14px}
.vsum.vhist ul{gap:4px}
.vside{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-top:1px solid #E6DAB0;background:#FBF4D6}
.vside div{border-radius:8px;padding:8px;text-align:center;border:2px solid transparent}
.vside b{display:block;font:700 24px/1 var(--mono)}
.vside span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.vside .t{color:var(--village)}.vside .w{color:var(--wolf)}
.vside .lead-t{border-color:var(--village);background:#EEF3F8}.vside .lead-w{border-color:var(--wolf);background:#F8E7E2}
.vnote{padding:0 12px 10px;font-size:13px;background:#FBF4D6;color:var(--ink)}
.votebox{margin:0 0 18px;border:2px solid var(--bark);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.votebox .vh{padding:10px 12px;background:var(--bark);color:var(--parch);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.votebox .vh b{font:400 18px/1.1 var(--display)}
.votebox .vh span{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.04em}
.votebox .vb{padding:12px}
.votebox p{margin:0 0 10px;font-size:14px}
.votebox .vl{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}
.vorder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.vorder span{min-width:40px;height:40px;padding:0 6px;border-radius:8px;background:var(--village);color:var(--paper);font:700 18px/40px var(--mono);text-align:center}
.vorder span.wd{background:transparent;color:var(--mute);border:2px dashed #CBBE93;text-decoration:line-through;line-height:36px}
.vorder i{font-style:normal;color:var(--mute);font-weight:700}
.vdir{display:inline-block;font-weight:700;color:var(--village)}
.vtabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.vtab{border:2px solid var(--bark);background:var(--paper);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.vtab b{font:700 22px/1 var(--mono)}
.vtab small{font-size:11px;font-weight:700;color:var(--mute)}
.vtab em{font:700 14px/1 var(--mono);font-style:normal;color:var(--wolf)}
.vtab.on{background:var(--wolf);border-color:var(--wolf);color:var(--paper)}
.vtab.on small,.vtab.on em{color:var(--paper)}
.dnum.vt{background:var(--wolf);border-color:var(--wolf);color:var(--paper)}
.dnum.vo{background:#EADFB0;border-style:dashed}
.dnum small.to{font:700 11px/1 var(--mono);color:inherit;opacity:.9}
.vsum{margin-top:12px;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px;background:#FBF4D6}
.vsum div b{font-family:var(--mono)}
.vgo{margin-top:12px;width:100%;border:2px solid var(--bark);background:var(--bark);color:var(--parch);border-radius:10px;padding:13px;font-weight:700;font-size:15px}
.vgo[disabled]{opacity:.4;cursor:default}
.vgo.alt{background:transparent;color:var(--bark);border-style:dashed}
.vboom{margin-top:10px;width:100%;border:2px dashed var(--wolf);background:transparent;color:var(--wolf);border-radius:10px;padding:11px;font-weight:700}
.vboom.on{background:var(--wolf);color:var(--paper);border-style:solid}
.vres{padding:12px;border-radius:10px;border-left:4px solid var(--village);background:#EEF3F8;font-size:15px;margin-bottom:10px}
.vres.bad{border-left-color:var(--wolf);background:#F8E7E2}
.vres.calm{border-left-color:var(--ok);background:#E9F1E4}
.vres b{font-family:var(--display);font-weight:600}
/* ===== GIAO DIỆN B · BÀN TRÒN DƯỚI TRĂNG =====
   Nhận diện theo masoithitruong.com: kem giấy, nâu gỗ, xanh, đỏ, vàng. Ban đêm nền xanh đêm của logo.
   Số ghế ban đêm xếp thành vòng tròn như bàn chơi thật. Font: Be Vietnam Pro. */
:root{--parch:#F8EFB5;--paper:#FEFCF5;--ink:#2B1810;--bark:#3E2723;--mute:#6B5E52;--gold:#D4AF37;--gold-soft:#E8D6A0;
  --night:#0F1A2C;--night2:#18263D;--night-line:#2C3E5C;--wolf:#9E2A2B;--village:#2E5A88;--ok:#3F6B3A;--coral:#D06A4C;--sky:#D6EBF4;
  --display:'Be Vietnam Pro',system-ui,sans-serif;--body:'Be Vietnam Pro',system-ui,sans-serif;--mono:'Be Vietnam Pro',system-ui,sans-serif}
body{font-family:var(--body);background-color:var(--parch);background-image:radial-gradient(rgba(139,94,60,.08) 1px,transparent 1.4px);background-size:7px 7px;font-variant-numeric:tabular-nums}
body.night{background:#0A111E radial-gradient(120% 55% at 50% 0,#24375A 0,#0F1A2C 55%,#0A111E 100%) fixed;color:#EEF2F8}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.lead{color:var(--mute)} body.night .lead{color:#AFC2DE}
.eyebrow{color:var(--village);letter-spacing:.14em} body.night .eyebrow{color:var(--gold)}
/* thanh trên */
.top{background:var(--parch);border-bottom:0;padding:10px 0;gap:8px}
body.night .top{background:rgba(15,26,44,.92);backdrop-filter:blur(6px)}
.top .logo{width:38px;height:38px;object-fit:contain;flex:none}
.brand{display:flex;flex-direction:column-reverse;font:800 17px/1.15 var(--display);letter-spacing:-.02em;text-transform:none}
.brand b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.brand small{margin:0 0 2px;font:700 10.5px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
body.night .brand small{color:#AFC2DE}
.tbtn{border:1.5px solid currentColor;border-radius:999px;padding:6px 9px;font-weight:700;font-size:13px;flex:none}
body.night .tbtn{color:#DCE6F3}
.tbtn.warn{background:var(--wolf);border-color:var(--wolf);color:#fff}
/* nút chính */
.dock{background:linear-gradient(transparent,var(--parch) 22px)}
body.night .dock{background:linear-gradient(transparent,#0A111E 22px)}
.cta{border:0;border-radius:999px;background:var(--night);color:var(--parch);font:700 17px/1 var(--body);letter-spacing:.01em;box-shadow:0 5px 0 #05090f;padding:17px}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #05090f}
body.night .cta{background:var(--gold);color:var(--night);box-shadow:0 5px 0 #6E5A1C}
.cta[disabled]{box-shadow:none}
.dock .hint{color:var(--wolf)} body.night .dock .hint{color:#AFC2DE}
/* bước 1: người chơi */
.plist{border:1.5px solid var(--bark);border-radius:16px;box-shadow:0 3px 0 var(--bark)}
.pno{border-radius:50%;border:1.5px solid #CBBE93}
.prow.has .pno{background:var(--night);border-color:var(--night);color:var(--parch)}
.pmeta b{font:800 34px/1 var(--display)}
.fill{border-radius:999px;border-width:1.5px}
.shotbtn{border-radius:999px;box-shadow:0 4px 0 var(--bark);border-width:1.5px}
/* bước 2: chia bài */
.setbox{background:transparent;border:0;padding:0}
.setbox h3{color:var(--village)}
.setgrid{display:flex;flex-wrap:wrap;gap:8px}
.setchip{border-radius:999px;padding:8px 12px;background:var(--paper);border-width:1.5px}
.setchip.on{background:var(--bark);border-color:var(--bark);color:var(--parch)}
.tally{background:var(--night);color:var(--parch);border:0;border-radius:16px;box-shadow:0 4px 0 #05090f;padding:12px 14px}
.tally b{font:800 26px/1 var(--display);letter-spacing:-.02em}
.tally .bar{background:rgba(255,255,255,.14)}
.tally .bar i{background:linear-gradient(90deg,#6E9BD0,var(--coral))}
.tally.full .bar i{background:linear-gradient(90deg,var(--village),var(--coral))}
.tally.over .bar i{background:#E58A78}
.tally .sub{color:#C9D6E8}
.rulebox{border-radius:16px;border-width:1.5px}
.rsearch input{border-radius:999px;border-width:1.5px}
.rgrp{border:1.5px solid var(--bark);border-radius:16px;background:rgba(254,252,245,.75);box-shadow:0 3px 0 var(--bark)}
.rgt{font:800 20px/1 var(--display);letter-spacing:-.02em}
.rgrp .rlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:14px 12px 12px;border:0;border-top:1.5px solid rgba(62,39,35,.2);background:transparent;border-radius:0}
.rlist .rcard{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:5px;border:1.5px solid var(--bark);border-radius:12px;background:var(--paper);box-shadow:0 2px 0 var(--bark);cursor:pointer;-webkit-tap-highlight-color:transparent}
.rlist .rcard:first-child{border-top:1.5px solid var(--bark)}
.rcard .face{border:1px solid rgba(212,175,55,.6);border-radius:8px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px 8px;background:linear-gradient(#FBF6DC,#F3E9BE);text-align:center}
.rcard.soi .face{background:linear-gradient(#FBEDE6,#F1D8CC)}
.rcard .face .art{width:56px;height:56px;object-fit:contain}
.rcard .face .art.mono{display:grid;place-items:center;border-radius:50%;background:#E9DDB0;font:800 24px/1 var(--display);color:var(--bark)}
.rcard .nm{font-weight:700;font-size:13px;line-height:1.15;color:var(--ink)}
.rcard .tag{font-size:9px;padding:2px 5px}
.rcard .dot{position:absolute;top:10px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--village)}
.rcard.soi .dot{background:var(--wolf)}
.rcard .n{position:absolute;top:-9px;right:-9px;z-index:1;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--bark);color:var(--parch);display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--parch)}
.rcard .step{justify-content:center;gap:10px;margin-top:6px}
.rcard .step button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--bark);background:var(--paper);font:700 18px/1 var(--body)}
.rcard .qi{align-self:center;margin-top:3px;padding:3px 6px;font-size:11px;font-weight:600;color:var(--mute)}
.rcard .ds{display:none;margin:4px 4px 2px;font-size:13px;line-height:1.45;color:var(--ink);text-align:left}
.rlist .rcard.open{grid-column:1/-1}
.rcard.open .ds{display:block}
.rcard.off{background:#2B1F18;border-color:#2B1F18;box-shadow:none}
.rcard.off .face{background:#2B1F18;border-color:rgba(212,175,55,.3)}
.rcard.off .face .art{filter:grayscale(1);opacity:.35}
.rcard.off .nm{color:#B9A57A}
.rcard.off .qi{color:#8C7B5E}
.rcard.off .ds{color:var(--gold-soft)}
.rcard.off .dot{opacity:.4}
/* ban đêm: thẻ vai + hàng chờ */
.queue{display:flex;flex-wrap:wrap;align-items:flex-end;gap:5px;margin:14px 0 6px}
.queue .q{width:30px;height:40px;border-radius:5px;border:1px solid rgba(212,175,55,.45);background:#1A2235;display:grid;place-items:center;overflow:hidden}
.queue .q .art{width:24px;height:24px;object-fit:contain}
.queue .q .art.mono{display:grid;place-items:center;font:800 12px/1 var(--display);color:var(--gold-soft)}
.queue .q.d{opacity:.3}
.queue .q.n{width:40px;height:54px;border:2px solid var(--gold);background:#2A1D16;box-shadow:0 0 14px rgba(212,175,55,.45)}
.queue .q.n .art{width:32px;height:32px}
.progtx{color:#AFC2DE}
.card{margin-top:12px;background:rgba(24,38,61,.55);border:1px solid rgba(212,175,55,.35);outline:0;border-radius:20px;padding:18px 16px 16px}
.card::before,.card::after{display:none}
.chead{display:flex;align-items:center;gap:14px}
.chead .cart{flex:none;width:60px;height:80px;border-radius:9px;background:#2A1D16;border:2px solid var(--gold);display:grid;place-items:center;box-shadow:0 0 18px rgba(212,175,55,.3)}
.chead .cart .art{width:46px;height:46px;object-fit:contain}
.chead .cart .art.mono{display:grid;place-items:center;font:800 22px/1 var(--display);color:var(--gold)}
.card .side-lb{letter-spacing:.16em}
.card .side-lb.tot{color:#9CC0E6}.card .side-lb.soi{color:#F0907C}
.card h1{margin:4px 0 0;font-size:30px;color:#FFF8E1}
.card .act{margin-top:12px;color:#C9D6E8;font-size:15px}
.block h3{color:var(--gold)}.block h3 span{color:#AFC2DE}
.note{background:rgba(214,235,244,.07);color:#DCE6F3;border-left:3px solid var(--gold)}
.note b{color:#fff}
.note.bad{background:rgba(240,144,124,.1);border-left-color:#F0907C}
.result{background:rgba(10,17,30,.55);border:1.5px solid rgba(212,175,55,.6)}
.result small{color:#C9D6E8}
.result .r.soi{color:#F0907C}.result .r.tot{color:#9CC0E6}
.seg button{background:rgba(10,17,30,.5);border-color:var(--night-line);color:#EEF2F8}
.seg button.on{background:var(--gold);border-color:var(--gold);color:var(--night)}
.skip{border-radius:999px;border-color:rgba(212,175,55,.6);color:var(--gold-soft)}
.skip.on{background:var(--gold);color:var(--night)}
.next-up{color:#AFC2DE}.next-up b{color:var(--gold)}
.ntimer{border-radius:999px;border-color:rgba(212,175,55,.6)}
.ntnote{color:#8EA3C2}
.vcall{border-radius:14px;font-family:var(--body);font-weight:600}
/* ghế: đồng xu tròn */
.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 8px}
.num{border-radius:50%;background:radial-gradient(circle at 35% 30%,#3A4C6E,#1C2840 75%);border:2px solid #4D6189;box-shadow:0 3px 0 #070C16;color:#EEF2F8;font:700 20px/1 var(--display);position:relative;overflow:visible}
.num small{color:#B5C6E0;font-size:9px;max-width:84%}
.num.tall{aspect-ratio:1;min-height:0;padding:0}
.num small.rl{display:none}
.num.on{background:radial-gradient(circle at 35% 30%,#FFE79A,#D4AF37 70%);border-color:#FFF2C4;color:#2B1810;box-shadow:0 0 0 4px rgba(212,175,55,.25),0 0 22px rgba(212,175,55,.55)}
.num.on small{color:#2B1810}
.num.wolf{border-color:#D9705E;background:radial-gradient(circle at 35% 30%,#6B2A27,#3A1514 75%)}
.num.wolf small{color:#F2B5A8}
.num.wolf::before{content:none}
.num.on.wolf{background:radial-gradient(circle at 35% 30%,#FFE79A,#D4AF37 70%);border-color:#E58A78;box-shadow:inset 0 0 0 2px #C0392B,0 0 22px rgba(212,175,55,.55)}
.num.on.wolf small{color:#5A1610}
.num.dead{opacity:.25}
.num.taken{opacity:.35}
.num.lock{background:repeating-linear-gradient(135deg,#2A1712 0 5px,#3A1D16 5px 10px);border:2px solid #E58A78;color:#E58A78}
.num.lock::after{content:none}
.num.sealed{border:2px dashed #E58A78}
.num .bd{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--sky);border:1.5px solid var(--night);display:grid;place-items:center;overflow:hidden}
.num.wolf .bd{background:#F7E2DA}
.bd .art{width:16px;height:16px;object-fit:contain}
.bd .art.mono{display:grid;place-items:center;font:800 10px/1 var(--display);color:var(--night)}
/* vòng bàn chơi */
.ring{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:14px auto 6px;container-type:inline-size}
.ring::before{content:"";position:absolute;inset:calc(var(--tk) / 2 + 4px);border-radius:50%;border:1px dashed rgba(212,175,55,.3);background:radial-gradient(rgba(44,62,92,.5),transparent 70%)}
.ring .num{position:absolute;left:50%;top:50%;width:var(--tk);height:var(--tk);margin:calc(var(--tk) / -2) 0 0 calc(var(--tk) / -2);aspect-ratio:auto;font-size:18px;gap:1px;
  transform:rotate(calc(var(--i) * 360deg / var(--n))) translateY(calc(var(--tk) / 2 - 50cqw)) rotate(calc(var(--i) * -360deg / var(--n)))}
.ring .num small{font-size:8.5px}
.ring .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38cqw;height:50cqw;border-radius:12px;background:#2A1D16;border:2px solid var(--gold);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 12px 26px rgba(0,0,0,.45)}
.ring .mid .art{width:60%;height:auto;max-height:50%;object-fit:contain}
.ring .mid .art.mono{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#3A2A1E;font:800 26px/1 var(--display);color:var(--gold)}
.ring .mid small{font-size:11px;font-weight:600;line-height:1.25;color:#C9B27A}
.ring .mid b{font:800 28px/1.05 var(--display);letter-spacing:-.02em;color:var(--gold)}
.ring .mid.on small{color:var(--gold-soft)}
/* vòng nhỏ buổi sáng */
.ring.lite{max-width:270px;margin:18px auto 4px}
.ring.lite::before{border-color:rgba(62,39,35,.3);background:none}
.ring.lite .num{background:var(--paper);border:1.5px solid var(--bark);box-shadow:0 2px 0 var(--bark);color:var(--ink);font-size:15px}
.ring.lite .num.d{background:var(--wolf);border-color:var(--bark);color:#fff;opacity:1}
.ring.lite .num.dead{opacity:.3}
.ring.lite .mid{width:auto;height:auto;background:transparent;border:0;box-shadow:none;color:var(--ink)}
.ring.lite .mid b{font-size:34px;color:var(--ink)}
.ring.lite .mid small{font-size:12px;color:var(--mute)}
.ring.lite .mid em{font-style:normal;font-size:12px;font-weight:700}
.ring.lite .mid em .t{color:var(--village)}.ring.lite .mid em .w{color:var(--wolf)}
/* sáng */
.dawn{background:linear-gradient(#F6C9A0,#FBEBC4 45%,var(--paper));border:1.5px solid var(--bark);border-radius:20px;box-shadow:0 4px 0 var(--bark)}
.dawn .k{color:#A0522D}
.dawn h1{font-size:28px}
.deaths{gap:14px}
.deaths span{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C4504B,#8E2526 70%);border:2px solid var(--bark);box-shadow:0 3px 0 var(--bark);font:800 28px/62px var(--display)}
.peace{font:800 38px/1.1 var(--display);letter-spacing:-.03em}
.winner{font:800 40px/1.1 var(--display);letter-spacing:-.03em}
details.gm,.mayorbox,.knightbox,.alivebox,.votebox,.rbox,.stat,.hintbox{border-radius:16px}
details.gm{border-width:1.5px}
/* ban ngày: ô số */
.dnum{border-radius:14px;border-width:1.5px;box-shadow:0 2px 0 var(--bark);font-family:var(--display)}
.dnum.dead{box-shadow:none}
.votebox{border-width:1.5px;box-shadow:0 3px 0 var(--bark)}
.votebox .vh b,.mayorbox h3,.knightbox h3,.side h2,.sheet h2,.shothead b{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.vgo,.kgo,.tear,.danger,.vboom,.mtoggle,.rolebtn{border-radius:999px}
.tm{border-radius:20px;border-width:1.5px}
.sheet .pane{border-radius:20px 20px 0 0}

/* ===== v3: menu, chặng, vòng ghế ban ngày, vote, cài đặt ===== */
.top{gap:10px}
.mwrap{position:relative;flex:none}
.menubtn{display:flex;align-items:center;gap:6px;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;color:inherit}
.menubtn i{font-style:normal;font-size:16px;line-height:1}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:250px;z-index:50;background:var(--paper);color:var(--ink);border:1.5px solid var(--bark);border-radius:16px;box-shadow:0 14px 30px rgba(15,26,44,.28);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:12px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink)}
.menu button:active{background:#F3EAC6}
.menu button[disabled]{opacity:.35;cursor:default}
.menu button span{width:22px;text-align:center;font-weight:800}
.tmb{font:800 12px/1 var(--body);background:var(--wolf);color:#fff;border-radius:999px;padding:4px 7px}
.tmb:empty{display:none}
/* nhắc thao tác */
.task{margin:12px 0 2px;display:flex;align-items:flex-start;gap:10px}
.task .who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
body.night .task .who.tot{color:#9CC0E6}body.night .task .who.soi{color:#F0907C}
.task h1{margin:2px 0 0;font-size:26px}
.task .info{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;background:transparent;font-weight:800;font-size:15px;opacity:.6;color:inherit}
.rule{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:rgba(214,235,244,.08);color:#DCE6F3;font-size:14px;line-height:1.45}
.tmr{display:inline-flex;margin-top:8px;padding:5px 10px;border-radius:999px;border:1px solid rgba(212,175,55,.5);color:var(--gold-soft);font-size:13px;font-weight:700}
.tmr.end{background:#9E2A2B;border-color:#9E2A2B;color:#fff}
.qtx{margin-left:auto;text-align:right;font-size:12px;font-weight:700;color:#AFC2DE;line-height:1.35}
.qtx b{display:block;color:var(--gold);font-size:14px}
.cnt{display:flex;justify-content:center;gap:6px}
.cnt i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold)}
.cnt i.f{background:var(--gold)}
/* nút phụ */
.ghost{width:100%;margin-top:10px;border:1.5px dashed currentColor;background:transparent;border-radius:999px;padding:12px;font-weight:700;font-size:15px;color:inherit;opacity:.9}
.ghost.red{color:var(--wolf)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pill{border:1.5px solid var(--bark);background:var(--paper);border-radius:999px;padding:12px 8px;font-weight:700;font-size:15px;color:var(--ink)}
.pill.red{background:var(--wolf);border-color:var(--wolf);color:#fff}
.pill[disabled]{opacity:.4;cursor:default}
#dockx:empty{display:none}
#dockx .ghost{margin-top:0}
/* chặng ban ngày */
.stages{display:flex;gap:4px;margin:12px 0 0}
.stages span{flex:1 1 auto;text-align:center;white-space:nowrap;font-size:11.5px;font-weight:700;padding:6px 6px;border-radius:999px;border:1.5px solid rgba(62,39,35,.25);color:var(--mute)}
.stages span.d{background:rgba(62,39,35,.08);border-color:transparent}
.stages span.n{background:var(--bark);border-color:var(--bark);color:var(--parch)}
.speaker{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px;border-radius:18px;background:var(--night);color:var(--parch)}
.speaker .no{width:60px;height:60px;border-radius:50%;background:var(--gold);color:var(--night);display:grid;place-items:center;font:800 28px/1 var(--display);flex:none}
.speaker .tx{flex:1;min-width:0}
.speaker .tx small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#AFC2DE}
.speaker .tx b{display:block;font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.speaker .clock{border:0;background:transparent;color:var(--parch);font:800 34px/1 var(--display);letter-spacing:-.02em;padding:4px}
.speaker .clock.low{color:#F0907C}.speaker .clock.pz{opacity:.45}
.order{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.order span{min-width:34px;height:34px;padding:0 8px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:14px;border:1.5px solid rgba(62,39,35,.3)}
.order span.d{opacity:.35;text-decoration:line-through}
.order span.n{background:var(--gold);border-color:var(--bark)}
.box{margin-top:14px;padding:14px;border-radius:16px;border:1.5px solid var(--bark);background:var(--paper);box-shadow:0 3px 0 var(--bark)}
.box h3{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.box p{margin:0;font-size:14px;color:var(--mute);line-height:1.45}
.box.red{border-color:var(--wolf);box-shadow:0 3px 0 var(--wolf)}.box.red h3{color:var(--wolf)}
.box.blue h3{color:var(--village)}
.box .ring{max-width:300px}
.vhist2{margin-top:8px;font-size:14px}
.vhist2 h4{margin:8px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--village)}
.vhist2 ul{margin:0;padding-left:18px}
.evbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:1.5px solid var(--wolf);color:var(--wolf);background:transparent;border-radius:999px;padding:11px;font-weight:700;font-size:14px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:12px;border:1.5px solid var(--bark);border-radius:14px;background:var(--paper);padding:10px 12px;text-align:left;color:var(--ink)}
.ev img,.ev .art{width:40px;height:40px;object-fit:contain;flex:none}
.ev b{display:block;font-size:15px}.ev small{font-size:13px;color:var(--mute)}
.ev[disabled]{opacity:.4;cursor:default}
.pane .sub{margin:0 0 12px;font-size:14px;color:var(--mute)}
.pane h2 button{border:0;background:none;font:700 15px var(--body);color:var(--mute)}
/* vote */
.vq{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 2px;padding:4px 16px 8px}
@media (hover:hover) and (pointer:fine),(min-width:700px){.vq{flex-wrap:wrap;overflow-x:visible;margin:8px 0 2px;padding:4px 0 8px}}
.vq em{font-style:normal;color:var(--mute);font-size:14px;padding:8px 0}
.vq button{flex:none;min-width:50px;border:1.5px solid var(--bark);background:var(--paper);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 var(--bark);color:var(--ink)}
.vq button b{font:800 18px/1 var(--display)}
.vq button small{font-size:10.5px;font-weight:700;color:var(--mute);margin-top:2px}
.vq button.w{border-color:var(--wolf)}
.vq button.has{background:#F8E2DA}
.vq button.n{background:var(--wolf);border-color:var(--bark);color:#fff}
.vq button.n small{color:#FCE3DC}
.vsum2{margin-top:6px;padding:10px 12px;border-radius:14px;background:#FBF4D6;font-size:14px;line-height:1.5}
.vsum2 ul{margin:0 0 6px;padding-left:18px}
.vsum2 span{color:var(--mute)}
.vsum2 p{margin:0;color:var(--mute)}
/* vòng ghế ban ngày */
.ring.dr::before{border-color:rgba(62,39,35,.28);background:none}
.ring.dr .num{background:var(--paper);border:1.5px solid var(--bark);box-shadow:0 2px 0 var(--bark);color:var(--ink);font-size:17px}
.ring.dr .num small{color:var(--mute)}
.ring.dr .num.wolf{background:#F8E2DA;border-color:var(--wolf)}
.ring.dr .num.wolf small{color:var(--wolf)}
.ring.dr .num.cand{background:var(--village);border-color:var(--bark);color:#fff}
.ring.dr .num.cand small{color:#D6EBF4}
.ring.dr .num.on{background:var(--wolf);border-color:var(--bark);color:#fff;box-shadow:0 2px 0 var(--bark)}
.ring.dr .num.on small{color:#FCE3DC}
.ring.dr .num.speak{background:#FFE9A8;color:var(--ink);box-shadow:0 0 0 5px rgba(212,175,55,.35),0 2px 0 var(--bark)}
.ring.dr .num.dead{opacity:.22;box-shadow:none}
.ring.dr .num.dim{opacity:.38}
.ring.dr .num.nd::after{content:"";position:absolute;bottom:-4px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--wolf);border:1.5px solid var(--paper)}
.ring.dr .num.may::before{content:"TT";position:absolute;top:-8px;left:-8px;font:800 9px/1 var(--body);background:var(--gold);color:var(--ink);border-radius:8px;padding:3px 4px;border:1.5px solid var(--bark)}
.ring.dr .mid{width:auto;height:auto;background:transparent;border:0;box-shadow:none;color:var(--ink)}
.ring.dr .mid b{color:var(--ink);font-size:30px}
.ring.dr .mid small{color:var(--mute)}
.num .vt{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:var(--wolf);color:#fff;font:800 11px/18px var(--body);text-align:center;border:1.5px solid var(--paper);white-space:nowrap}
/* cài đặt */
.opt{margin-top:12px;padding:14px;border:1.5px solid var(--bark);border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--bark);color:var(--ink)}
.opt h3{margin:0 0 4px;font-size:17px;font-weight:800}
.opt p{margin:0 0 12px;font-size:14px;color:var(--mute);line-height:1.45}
.opt .hd{display:flex;align-items:flex-start;gap:12px}.opt .hd div{flex:1}
.opt .sw{flex:none;width:52px;height:30px;border-radius:15px;border:1.5px solid var(--bark);background:#E5DDBE;position:relative;padding:0}
.opt .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--bark);transition:left .15s}
.opt .sw.on{background:var(--village)}.opt .sw.on::after{left:25px;background:var(--paper)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--bark);background:var(--paper);font-weight:800;font-size:20px;color:var(--ink)}
.stepper b{min-width:84px;text-align:center;font:800 30px/1 var(--display);letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1.5px solid var(--bark);background:var(--paper);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.chips button.on{background:var(--bark);color:var(--parch)}
/* chọn set */
.field{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.field label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--village)}
.field small{font-size:13px;color:var(--mute)}
.select{position:relative}
.select select{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--bark);border-radius:14px;background:var(--paper);padding:14px 44px 14px 14px;font:700 16px var(--body);color:var(--ink);box-shadow:0 3px 0 var(--bark)}
.select::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--bark);border-bottom:2.5px solid var(--bark);transform:translateY(-70%) rotate(45deg);pointer-events:none}
/* thông báo hoàn tác */
.sndask{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;border:0;border-radius:999px;padding:12px 18px;background:#B8322A;color:#fff;font:700 15px var(--body);box-shadow:0 8px 20px rgba(0,0,0,.35);animation:sndp 1.2s ease-in-out infinite}
.sndask[hidden]{display:none}
@keyframes sndp{50%{transform:translateX(-50%) scale(1.05)}}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:35;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:999px;background:#1B2638;color:#fff;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast button{border:0;border-radius:999px;background:var(--gold);color:var(--night);font-weight:800;padding:7px 12px;font-size:13px;flex:none}
.shoth{margin:14px 0 6px;font:800 16px var(--display)}
.pulled{color:var(--wolf);font-weight:800}

.crn{position:absolute;bottom:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:#FFF3C4;border:1.5px solid var(--night);display:grid;place-items:center;overflow:hidden}
.crn img,.crn .art{width:17px;height:17px;object-fit:contain}.crn.off{filter:grayscale(1);opacity:.6}
.zz{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:800 12px/1 var(--body);color:#8EB5F0;text-shadow:0 0 6px rgba(142,181,240,.8)}
.cursebar{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(142,181,240,.12);border:1.5px solid rgba(142,181,240,.5);color:#DCE6F3;font-size:14px;font-weight:600}
.cursebar small{display:block;color:#AFC2DE;font-size:12px;margin-top:2px}
.win.cc .winner{color:#A67C00}
.skip.on{background:var(--gold);color:var(--night);border-style:solid}
.pill.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.seg2 button.on small{opacity:.95;color:#FCE3DC}

.xembody{background:var(--parch,#F7EDC2)}
.xem{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.xh{display:flex;align-items:center;gap:10px;margin-bottom:18px}.xh .logo{width:44px;height:auto}
.xh small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.xh b{font-size:18px;font-weight:800}
.xem h1{margin:2px 0 10px;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.xsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xsum span{border:1.5px solid var(--bark);border-radius:14px;background:var(--paper);padding:10px;text-align:center;font-weight:700;font-size:13px;color:var(--mute)}
.xsum b{display:block;font-size:28px;font-weight:800}.xsum .tot b{color:var(--village)}.xsum .soi b{color:var(--wolf)}
.xg{margin:24px 2px 8px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.xg.tot{color:var(--village)}.xg.soi{color:var(--wolf)}
.xl{border:1.5px solid var(--bark);border-radius:16px;background:var(--paper);overflow:hidden;box-shadow:0 3px 0 var(--bark)}
.xr{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px;border-top:1px solid #E6DAB0;align-items:start}.xr:first-child{border-top:0}
.xa{width:48px;height:48px;display:grid;place-items:center}.xa img,.xa .art{width:48px;height:48px;object-fit:contain}
.xi{font-size:28px;line-height:1}
.xt b{font-size:16px;font-weight:800}.xt b em{font-style:normal;color:var(--mute)}.xt b i{font-style:normal;font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--mute)}
.xr.soi .xt b{color:var(--wolf)}
.xt p{margin:3px 0 0;font-size:14px;line-height:1.5;color:var(--ink)}
.xt p.wl{margin-top:6px;padding-left:10px;border-left:3px solid}.xt p.wl b{font-size:14px}
.xt p.wl.tot{border-color:var(--village)}.xt p.wl.tot b{color:var(--village)}.xt p.wl.soi{border-color:var(--wolf)}.xt p.wl.soi b{color:var(--wolf)}
.xfooter{width:100vw;margin:28px 0 -40px calc(50% - 50vw);padding:28px 20px 22px;box-sizing:border-box;color:#FEFCF5;font-family:Quicksand,'Be Vietnam Pro',sans-serif;

.xfin{max-width:520px;margin:0 auto}
.xembody,.xemov{overflow-x:hidden}
@media (min-width:760px){
  .xem{max-width:720px}
  .xfin{max-width:1100px;display:grid;grid-template-columns:1fr 1fr;column-gap:60px;padding:16px 24px 0}
  .xfin .xfl{grid-column:1}.xfin .xfr{grid-column:2}
  .xfcopy{grid-column:1/-1}
  .xftag{margin-bottom:0;max-width:340px}
}
.xfbrand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#F8EFB5;font-weight:800;font-size:18px;letter-spacing:.02em}
.xfbrand img{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:contain;padding:2px}
.xftag{margin:10px 0 22px;font-size:13.6px;font-weight:600;line-height:1.6;color:rgba(254,252,245,.95)}
.xfooter h4{margin:0 0 14px;color:#F8EFB5;font-size:12.8px;font-weight:800;letter-spacing:.06em;display:inline-block;padding-bottom:4px;background:linear-gradient(#F8EFB5,#F8EFB5) left bottom/28px 2px no-repeat}
.xsoc{display:flex;flex-wrap:wrap;gap:10px}
.xsoc a{background:#F8EFB5;color:#2B1810;border:2px solid #3E2723;border-radius:6px;box-shadow:2px 2px 0 #3E2723;padding:8px 16px;font-size:12.8px;font-weight:800;text-decoration:none}
.xsoc a:active{transform:translate(2px,2px);box-shadow:none}
.xfcopy{margin-top:24px;padding-top:16px;border-top:1px solid rgba(248,239,181,.25);text-align:center;font-size:12.8px;font-weight:700;color:#FEFCF5}
.xemov{position:fixed;inset:0;z-index:9999;overflow:auto;background:var(--parch,#F7EDC2)}
.xemov .xclose{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#1B2440;color:#F8EFB5;font-weight:800;font-size:14px}
.xemov .xclose button{background:#F8EFB5;color:#2B1810;border:2px solid #3E2723;border-radius:8px;padding:6px 12px;font-weight:800}
.xfoot{margin-top:18px;font-size:13px;color:var(--mute);text-align:center}
.qrbox{margin:16px auto 0;width:min(78vw,300px);padding:12px;background:#fff;border:1.5px solid var(--bark);border-radius:18px;box-shadow:0 3px 0 var(--bark)}
.qrbox svg{display:block;width:100%;height:auto}
.qrinfo{text-align:center;margin-top:14px;font-size:15px}
.qrchips{display:grid;gap:8px;margin-top:12px}
.qrchips>div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.qrchips small{width:100%;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.qrchips .tot small{color:var(--village)}.qrchips .soi small{color:var(--wolf)}
.qrchips span{border:1.5px solid var(--bark);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.qrchips .soi span{border-color:var(--wolf)}
.qrlink{display:block;text-align:center;margin-top:14px;font-weight:700;color:var(--village)}
.pane .qrbox{width:min(70vw,280px)}
.ovbox{margin-top:12px;padding:12px 14px;border:1.5px solid var(--bark);border-radius:14px;background:#FFFDF6}
.ovbox small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ovbox>b{display:block;font-size:34px;font-weight:800;letter-spacing:.18em;color:var(--ink)}
.ovurl{display:block;width:100%;box-sizing:border-box;margin:4px 0 8px;border:1.5px solid var(--bark);border-radius:10px;padding:8px 10px;font:500 13px/1.3 var(--body);background:#fff;color:var(--ink)}
/* Gợi ý tên người chơi từ database (bảng players) */
#sug{position:fixed;z-index:90;background:var(--paper);border:1.5px solid var(--bark);border-radius:12px;box-shadow:0 6px 0 rgba(62,39,35,.25),0 10px 24px rgba(0,0,0,.25);overflow-y:auto;overscroll-behavior:contain;max-height:min(260px,40vh)}
#sug[hidden]{display:none}
#sug button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:0;border-top:1px solid #E6DAB0;background:transparent;font:600 15px var(--body);color:var(--ink);cursor:pointer}
#sug button:first-child{border-top:0}
#sug button:active,#sug button:hover{background:#FBF4D6}
#sug .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sug .sn small{font-weight:500;color:var(--mute);margin-left:6px}
#sug .st{flex:none;font:700 11px var(--body);color:var(--parch);background:var(--night);border-radius:6px;padding:2px 7px}
#sug .se{flex:none;font:600 12px var(--body);color:var(--mute)}
#sug .sd{padding:10px 12px;font:500 13px var(--body);color:var(--mute)}
</style>

function applySet(id){
  const s=setById(id); if(!s) return;
  S.on={}; s.on.forEach(k=>S.on[k]=true); S.cnt={dan:s.dan,soi:s.soi};
  S.setPlus=0;
  if(s.plus&&S.n>=14){ S.cnt.soi++; if(S.on.ngoc) S.cnt.dan++; else S.on.ngoc=true; S.setPlus=1; }
  S.cnt.dan=Math.max(0,S.n-(totalCards()-S.cnt.dan));
  S.set=id; S.setEdited=0; S.rules=Object.assign({mnLast:'drag'},s.rules||{});
}
