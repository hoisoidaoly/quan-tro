<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Overlay người chơi · Thị Trấn Đạo Lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@600;700;800&subset=vietnamese&display=swap">
<style>
/* OBS Browser Source 1920×1080, nền trong suốt. Cột trái số 1–6, cột phải số 7–12.
   Khung 01–06 có số ở góc trên trái, 07–12 có số ở góc trên phải. Icon vai nằm góc trên phía đối diện số,
   cúp Thị trưởng nằm giữa cạnh phía trong (hướng vào giữa màn hình).
   Tham số: room=PHÒNG (mặc định TTDL) · fw=bề rộng khung (188) · gap=khoảng cách dọc (179) · x=lề ngang (6) · y=lề trên (4) · test=1 */
html,body{margin:0;background:transparent;overflow:hidden;width:1920px;height:1080px}
#root{position:absolute;inset:0;transition:opacity .5s}
#root.hide{opacity:0}
.slot{position:absolute;transition:filter .7s ease}
.slot .ph{position:absolute;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 35%,#3A5480,#141F33 75%)}
.slot .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .7s ease,opacity .4s}
.slot .ph img:not([src]),.slot .ph img[src=""]{opacity:0}
.slot .fr{position:absolute;left:0;top:0;width:100%;height:auto;transition:opacity .45s ease}
.slot .fr.p{opacity:0}
.slot.pov .fr.p{opacity:1}
.slot.pov .fr.a{opacity:0}
/* chết: xám toàn khung, hoặc dấu X đỏ */
.slot.dead.gray>:not(.gl){filter:grayscale(1) brightness(.62) contrast(1.05)}
/* vầng sáng đang phát biểu: lớp dưới cùng, nhấp nháy nhẹ */
.slot .gl{position:absolute;opacity:0;transition:opacity .4s ease;pointer-events:none}
.slot.speak .gl{opacity:1;animation:breathe 1.8s ease-in-out .4s infinite}
/* to hơn 16% so với file gốc */
.slot.speak .gl{transform:scale(1.16);filter:saturate(1.3) brightness(1.08)}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1.16)}50%{opacity:.6;transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.slot.speak .gl{animation:none}}
.slot .xx{position:absolute;display:grid;place-items:center;opacity:0;transform:scale(1.4);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.slot.dead.xmode .xx{opacity:1;transform:none}
.slot.dead.xmode .ph img{filter:grayscale(1) brightness(.65)}
.slot .xx svg,.slot .xx img{width:100%;height:100%;grid-area:1/1}
.slot .xx img{display:none;object-fit:contain}
#root.cx .slot .xx img{display:block}
#root.cx .slot .xx svg{display:none}
/* cúp Thị trưởng */
.slot .tt{position:absolute;height:auto;opacity:0;transform:scale(.3) rotate(-12deg);transition:opacity .35s,transform .55s cubic-bezier(.3,1.6,.5,1);pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.slot.mayor .tt{opacity:1;transform:none}
/* bàn tay: người lên giàn tranh cử, cùng chỗ với cúp */
.slot .hand{position:absolute;height:auto;opacity:0;transform:scale(.4);transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.slot.cand .hand{opacity:1;transform:none}
/* ===== bảng tổng kết ván (hướng A · Cáo thị làng) ===== */
#sum *{box-sizing:border-box}
#sum{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease}
#sum.on{opacity:1}
#sum .dim{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(20,12,6,.6),rgba(20,12,6,.25))}
#sum .sheet{--parch:#F8EFB5;--paper:#FEFCF5;--ink:#2B1810;--bark:#3E2723;--mute:#6B5E52;--wolf:#9E2A2B;--village:#2E5A88;--ok:#3F6B3A;--gold:#B8902F;--line:#E2D29F;
  position:absolute;left:300px;top:28px;width:1320px;background:var(--parch);border:5px solid var(--bark);border-radius:26px;color:var(--ink);
  box-shadow:0 14px 0 rgba(43,24,16,.55),0 30px 60px rgba(0,0,0,.45);padding:24px 34px 22px;display:grid;gap:16px;transform:scale(var(--k,1));transform-origin:50% 0;transition:transform .5s cubic-bezier(.2,.9,.3,1.1);
  background-image:radial-gradient(rgba(62,39,35,.07) 1px,transparent 1.4px);background-size:7px 7px;font-family:'Be Vietnam Pro',sans-serif;font-kerning:normal;text-rendering:optimizeLegibility}
#sum:not(.on) .sheet{transform:translateY(24px) scale(var(--k,1))}
#sum .hd{display:flex;align-items:center;gap:24px;border-bottom:3px dashed var(--line);padding-bottom:16px}
#sum .hd .tx{flex:1;min-width:0}
#sum .k{font:700 15px/1.4 'Be Vietnam Pro';letter-spacing:.12em;color:var(--mute)}
#sum h1{margin:10px 0 0;padding-top:.12em;font:800 76px/1.12 'Baloo 2';color:var(--village);letter-spacing:.005em}
#sum h1.soi{color:var(--wolf)}#sum h1.cc{color:#A67C00}
#sum .why{margin:6px 0 0;font:600 22px/1.4 'Be Vietnam Pro';color:var(--mute)}
#sum .stamp{flex:none;width:176px;height:176px;border:5px solid var(--wolf);border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(-9deg);color:var(--wolf);
  box-shadow:inset 0 0 0 6px var(--parch),inset 0 0 0 8px var(--wolf);font:800 13px/1.35 'Be Vietnam Pro';letter-spacing:.1em}
#sum .stamp b{display:block;font:800 34px/1.15 'Baloo 2';letter-spacing:.01em;margin:2px 0}
#sum .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) repeat(2,minmax(0,1.3fr));gap:12px}
#sum .st{background:var(--paper);border:2.5px solid var(--bark);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:0}
#sum .st b{font:800 42px/1.1 'Baloo 2';padding-top:.08em}#sum .st span{font:700 14px/1.35 'Be Vietnam Pro';color:var(--mute);letter-spacing:.06em}
#sum .st.than b{color:var(--village)}#sum .st.dan b{color:var(--ok)}#sum .st.soi b{color:var(--wolf)}
#sum .aw img,#sum .aw .ini{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:2.5px solid var(--bark);object-fit:contain;padding:2px}
#sum .aw .t{min-width:0;line-height:1.25}#sum .aw small{display:block;font:800 12px/1.3 'Be Vietnam Pro';letter-spacing:.12em;color:var(--gold)}
#sum .aw.svp small{color:#7D878E}#sum .aw strong{display:block;font:800 23px/1.25 'Baloo 2';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sum .aw em{display:block;font:600 14px/1.3 'Be Vietnam Pro';font-style:normal;color:var(--mute)}
#sum .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}
#sum .r{display:grid;grid-template-columns:44px 58px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 14px 6px 8px;min-height:78px}
#sum .r .n{font:800 34px/1.1 'Baloo 2';text-align:center;padding-top:.08em}
#sum .r .ic,#sum .ini{width:58px;height:58px;border-radius:50%;background:#fff;border:2.5px solid var(--bark);object-fit:contain;padding:3px}
#sum .ini{display:grid;place-items:center;font:800 24px/1 'Baloo 2';color:var(--bark)}
#sum .r .nm{font:800 24px/1.3 'Baloo 2';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
#sum .r .rl{margin-top:1px;font:700 15px/1.35 'Be Vietnam Pro';color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sum .g{font:800 11px/1 'Be Vietnam Pro';letter-spacing:.1em;color:#fff;border-radius:6px;padding:4px 6px 3px;margin-right:7px;vertical-align:1px}
#sum .g.than{background:var(--village)}#sum .g.dan{background:var(--ok)}#sum .g.soi{background:var(--wolf)}
#sum .r .f{font:700 15px/1.35 'Be Vietnam Pro';text-align:right;color:var(--ok);max-width:190px}
#sum .r.out{background:#EFE4C4;border-color:#D9C79A}#sum .r.out .ic{filter:grayscale(1);opacity:.7}
#sum .r.out .nm{color:#8F7F6A;text-decoration:line-through;text-decoration-color:var(--wolf);text-decoration-thickness:3px;text-decoration-skip-ink:none}
#sum .r.out .n{color:#B8AA88}#sum .r.out .f{color:var(--wolf)}
#sum .tag{display:inline-block;font:800 11px/1 'Be Vietnam Pro';letter-spacing:.06em;padding:5px 8px 4px;border-radius:999px;background:var(--gold);color:#fff;margin-left:8px;vertical-align:5px;text-decoration:none}
#sum .tl{display:grid;grid-template-columns:repeat(var(--c,6),minmax(0,1fr));gap:12px 0;border-top:3px dashed var(--line);padding-top:14px}
#sum .ph{padding:0 14px;border-left:2px solid var(--line)}#sum .ph.first{border-left:0;padding-left:0}
#sum .ph h3{margin:0 0 8px;font:800 17px/1.2 'Baloo 2';letter-spacing:.05em;display:flex;align-items:center;gap:7px}
#sum .ph h3 i{flex:none;width:15px;height:15px;border-radius:50%;display:inline-block}
#sum .ph.night h3{color:var(--bark)}#sum .ph.night h3 i{background:var(--bark);box-shadow:inset -5px 0 0 var(--parch)}
#sum .ph.day h3{color:#9A7200}#sum .ph.day h3 i{background:#E9B93C}
#sum .ph p{margin:0 0 6px;font:600 15px/1.4 'Be Vietnam Pro'}
#sum .pg-tl .ph p{font-size:17px;line-height:1.42;margin-bottom:8px}#sum .pg-tl .ph h3{font-size:20px}
#sum .pg-tl .tl{border-top:0;padding-top:4px;gap:22px 0}
#sum .pg-tl h1{font-size:60px}#sum .pg-tl .stamp{width:140px;height:140px}#sum .pg-tl .stamp b{font-size:27px}
#sum .pgk{display:inline-block;margin-left:10px;padding:3px 9px 2px;border-radius:999px;background:var(--bark);color:var(--parch);letter-spacing:.1em}#sum .ph p.d{color:var(--wolf);font-weight:800}#sum .ph p.ok{color:var(--ok)}
.slot .nm{position:absolute;left:0;width:100%;overflow:visible}
.slot .nm text{font-family:'Baloo 2',sans-serif;font-weight:800}
/* icon vai: ngoài vành trăng, góc trên */
.slot .ic{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#FEFCF5;border:3px solid #1B2440;box-shadow:0 3px 0 rgba(0,0,0,.35);
  display:grid;place-items:center;overflow:hidden;animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
.slot .ic img{width:40px;height:40px;object-fit:contain}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
</style></head>
<body><div id="root"></div><div id="sum"><div class="dim"></div><div class="sheet" id="sheet"></div></div>
<script>
const Q=new URLSearchParams(location.search), ROOM=(Q.get('room')||'TTDL').toUpperCase();
const FW=+Q.get('fw')||188, FH=FW*2048/2096, GAP=+Q.get('gap')||179, MX=Q.get('x')!=null?+Q.get('x'):6, MY=Q.get('y')!=null?+Q.get('y'):4;
const CX=FW*.5187, CY=FH*.4065, R=FW*.2566+2;
/* tâm dọc của chữ tên: giữa phần thân đám mây (tính theo chiều cao khung). Chỉnh bằng &ny=0.82 */
const NMY=+Q.get('ny')||.825;
const BASE=location.protocol==='file:'?'https://quantro.hoisoidaoly.workers.dev':'';
const pad=n=>String(n).padStart(2,'0'), esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let ROLES={}; fetch(BASE+'/roles/roles.json').then(r=>r.json()).then(l=>{ l.forEach(x=>ROLES[x.id]=x); render(); }).catch(()=>{});
let S={players:Array.from({length:12},()=>({name:'',dead:0,pov:0,roles:[]})),set:{dead:'gray',hide:0,fs:100},mayor:null,speak:null}, AV={};
const root=document.getElementById('root');
/* dấu X riêng: có file /frames/x.webp thì dùng, không có thì dùng dấu X vẽ sẵn */
const XI=new Image(); XI.onload=()=>root.classList.add('cx'); XI.src=BASE+'/frames/x.webp';
const TTH=2*R*1.1, TTW=TTH*284/380, HW=Math.min(80,2*R*.82);
function place(n){ return {left:n<=6,row:(n-1)%6}; }
/* vị trí vầng sáng so với góc khung (đo từ file S01–S12, khung rộng 188) */
const GL={1:[-5.2,-4,194.2,181.5],2:[-5.2,-16.5,194.2,195],3:[-5.2,-15.5,194.2,195],4:[-5.2,-14.5,194.2,195],5:[-5.2,-13.5,194.2,195],6:[-5.2,-12.5,194.2,193.5],
  7:[-1,-4,194.2,181.5],8:[-1,-16.5,194.2,195],9:[-1,-15.5,194.2,195],10:[-1,-14.5,194.2,195],11:[-1,-13.5,194.2,195],12:[-1,-12.5,194.2,193.5]};
const gk=FW/188;
/* dựng 12 khung một lần, sau đó chỉ cập nhật */
const slots=Array.from({length:12},(_,i)=>{ const n=i+1, el=document.createElement('div');
  el.className='slot'; el.style.cssText=`width:${FW}px;height:${FH}px`;
  const g=GL[n];
  el.innerHTML=`<img class="gl" src="${BASE}/glow/s${pad(n)}.webp" alt="" style="left:${g[0]*gk}px;top:${g[1]*gk}px;width:${g[2]*gk}px;height:${g[3]*gk}px"><div class="ph" style="left:${CX-R}px;top:${CY-R}px;width:${2*R}px;height:${2*R}px"><img alt=""></div>
    <img class="fr a" src="${BASE}/frames/a${pad(n)}.webp" alt=""><img class="fr p" src="${BASE}/frames/p${pad(n)}.webp" alt="">
    <div class="xx" style="left:${CX-R}px;top:${CY-R}px;width:${2*R}px;height:${2*R}px"><svg viewBox="0 0 100 100"><g stroke-linecap="round" fill="none"><path d="M18 20 L82 80 M82 18 L20 82" stroke="#1B2440" stroke-width="17"/><path d="M18 20 L82 80 M82 18 L20 82" stroke="#E2382F" stroke-width="10"/></g></svg><img src="${BASE}/frames/x.webp" alt=""></div>
    <img class="tt" src="${BASE}/assets/thi-truong.webp" alt="" style="width:${TTW}px;top:${CY-TTH/2}px">
    <img class="hand" src="${BASE}/assets/tay.webp" alt="" style="width:${HW}px;top:${CY-HW/2}px">
    <svg class="nm" style="top:${FH*.70}px" height="${FH*.32}" viewBox="0 0 ${FW} ${FH*.32}"><text x="${CX}" y="${FH*.215}" text-anchor="middle" fill="#fff" stroke="#2E5A88" stroke-width="8" stroke-linejoin="round" paint-order="stroke"></text></svg>
    <div class="icons"></div>`;
  root.appendChild(el); return el; });
/* số 1–6 ở góc trái → icon vòng bên phải; số 7–12 ở góc phải → icon vòng bên trái */
/* icon không được tràn ra khỏi màn hình (khung sát mép), chạm mép thì đẩy vào trong */
function iconPos(k,n,sx,sy){ let a=[-38,-6,26,58][k]??(58+32*(k-3)); if(n>=7) a=180-a; const t=a*Math.PI/180, d=FW*.45;
  let x=CX+Math.cos(t)*d, y=CY+Math.sin(t)*d; x=Math.max(27-sx,Math.min(1893-sx,x)); y=Math.max(27-sy,y); return [x,y]; }
function render(){
  const set=S.set||{}, lay='a', gfs=(+set.fs||100)/100;
  root.classList.toggle('hide',!!set.hide); try{ renderSum(); }catch(e){}
  S.players.forEach((p,i)=>{ const el=slots[i]; if(!el) return; p=p||{}; const n=i+1, pl=place(n);
    el.style.left=(pl.left?MX:1920-MX-FW)+'px'; el.style.top=(MY+pl.row*GAP)+'px';
    const tt=el.querySelector('.tt'); tt.style.left=(pl.left?FW+2:-TTW-2)+'px';
    const hd=el.querySelector('.hand'); hd.style.left=(pl.left?FW+2+(TTW-HW)/2:-TTW-2+(TTW-HW)/2)+'px';
    el.classList.toggle('cand',S.mayor==null&&!p.dead&&(S.cand||[]).includes(n));
    el.classList.toggle('mayor',S.mayor===n); el.classList.toggle('speak',S.speak===n&&!p.dead); /* người chết không phát biểu */
    el.classList.toggle('pov',!!p.pov); el.classList.toggle('dead',!!p.dead);
    el.classList.toggle('gray',(S.set&&S.set.dead)!=='x'); el.classList.toggle('xmode',(S.set&&S.set.dead)==='x');
    const img=el.querySelector('.ph img'), u=AV[i+1]||''; if(img.getAttribute('src')!==u) u?img.setAttribute('src',u):img.removeAttribute('src');
    const tx=el.querySelector('.nm text'), nm=(p.name||'').toUpperCase(), sc=gfs*(+p.fs||100)/100, tk=nm+'|'+sc;
    if(tx.dataset.k!==tk){ tx.dataset.k=tk; tx.textContent=nm; tx.removeAttribute('textLength');
      const z=(nm.length>11?20:nm.length>8?23:27)*sc, cap=FW*(sc>1?1.02:.96); tx.setAttribute('font-size',z.toFixed(1)); tx.setAttribute('y',(FH*(NMY-.70)+z*.33).toFixed(1)); tx.setAttribute('stroke-width',(8*Math.sqrt(sc)).toFixed(1));
      requestAnimationFrame(()=>{ try{ if(tx.getComputedTextLength()>cap){ tx.setAttribute('textLength',cap); tx.setAttribute('lengthAdjust','spacingAndGlyphs'); } }catch(e){} }); }
    const box=el.querySelector('.icons'), want=(p.roles||[]).filter(r=>ROLES[r]), key=want.join(',')+'|'+lay;
    if(box.dataset.k!==key){ box.dataset.k=key; box.innerHTML=want.map((r,k)=>{ const [x,y]=iconPos(k,n,parseFloat(el.style.left),parseFloat(el.style.top)); return `<div class="ic" style="left:${x}px;top:${y}px;animation-delay:${k*.06}s"><img src="${BASE}/roles/${ROLES[r].f}" alt="${esc(ROLES[r].n)}"></div>`; }).join(''); }
  }); }
/* ---------- bảng tổng kết ---------- */
let SUM=null, sumKey='';
const SE=s=>esc(s);
function renderSum(){ const box=document.getElementById('sum'), on=!!(SUM&&S.set&&S.set.sum);
  const key=on?JSON.stringify(SUM)+'|'+(S.set.sump||'bai'):''; if(on&&key!==sumKey){ sumKey=key; buildSum(); }
  box.classList.toggle('on',on); }
function buildSum(){ const s=SUM, sh=document.getElementById('sheet'), GN={than:'THẦN',dan:'DÂN',soi:'SÓI'};
  const ic=(id,cls,alt)=>ROLES[id]?`<img class="${cls}" src="${BASE}/roles/${ROLES[id].f}" alt="${SE(alt||'')}">`:`<span class="ini">${SE((alt||'?').trim().charAt(0).toUpperCase())}</span>`;
  const row=r=>r?`<div class="r ${r.alive?'':'out'}"><span class="n">${r.p}</span>${ic(r.id,'ic',r.role)}<div style="min-width:0"><div class="nm">${SE(r.name||'Số '+r.p)}${(r.tags||[]).filter(t=>/MVP|SVP|Thị trưởng/.test(t)).map(t=>`<span class="tag">${SE(t)}</span>`).join('')}</div><div class="rl"><span class="g ${r.g}">${GN[r.g]||''}</span>${SE(r.role)}</div></div><div class="f">${SE(r.fate||'')}</div></div>`:'<div></div>';
  const L=s.rows.filter(r=>r.p<=6), Rr=s.rows.filter(r=>r.p>6), nRow=Math.max(L.length,Rr.length);
  const day=(s.when||'').split(' ').find(x=>/\d+\/\d+\/\d+/.test(x))||'';
  const aw=(lb,v,cls)=>v?`<div class="st aw ${cls}">${ic(v.id,'',v.role)}<div class="t"><small>${lb}</small><strong>Số ${v.p}${v.name?' · '+SE(v.name):''}</strong><em>${SE(v.role)}</em></div></div>`:`<div class="st aw ${cls}"><div class="t"><small>${lb}</small><strong>Chưa chọn</strong></div></div>`;
  const tl=s.tl||[], cols=Math.min(Math.max(tl.length,1),6), page=S.set.sump==='tl'?'tl':'bai';
  sh.style.setProperty('--c',cols); sh.classList.toggle('pg-tl',page==='tl');
  sh.innerHTML=`<div class="hd"><div class="tx"><div class="k">${page==='tl'?'DIỄN BIẾN VÁN':'BẢN TỔNG KẾT'} · VÁN ${s.n} NGƯỜI · ${s.nights} ĐÊM${s.set?' · '+SE(s.set).toUpperCase():''}</div>
    <h1 class="${s.win.side}">${SE(s.win.name).toUpperCase()}</h1><p class="why">${SE(s.win.reason)}</p></div>
    <div class="stamp"><div>THỊ TRẤN<b>ĐẠO LÝ</b>${SE(day)}</div></div></div>
   ${page==='bai'?`<div class="stats">${s.stats.map(([n,a,t,g])=>`<div class="st ${g}"><b>${a}/${t}</b><span>${SE(n).toUpperCase()}<br>CÒN SỐNG</span></div>`).join('')}${aw('MVP · PHE THẮNG',s.mvp,'')}${aw('SVP · PHE THUA',s.svp,'svp')}</div>
   <div class="rows">${Array.from({length:nRow},(_,i)=>row(L[i])+row(Rr[i])).join('')}</div>`:''}
   ${page==='tl'&&tl.length?`<div class="tl">${tl.map((g,i)=>`<div class="ph ${/Đêm/i.test(g.ph)?'night':'day'} ${i%cols===0?'first':''}"><h3><i></i>${SE(g.ph).toUpperCase()}</h3>${g.items.map(it=>`<p class="${it.d?'d':it.ok?'ok':''}">${SE(it.t)}</p>`).join('')}</div>`).join('')}</div>`:''}`;
  /* vừa khung 1080: cao quá thì thu nhỏ cả bảng */
  requestAnimationFrame(()=>{ const h=sh.offsetHeight, k=Math.min(1,1024/h); sh.style.setProperty('--k',k.toFixed(4)); sh.style.top=Math.max(28,(1080-h*k)/2)+'px'; }); }
function onMsg(m){ if(!m) return;
  if(m.type==='full'){ if(m.state) S=m.state; AV=m.avatars||{}; SUM=m.summary||null; render(); }
  else if(m.type==='summary'){ SUM=m.summary||null; render(); }
  else if(m.type==='state'){ S=m.state; render(); }
  else if(m.type==='avatar'){ if(m.url) AV[m.n]=m.url; else delete AV[m.n]; render(); } }
if(Q.get('test')){ const nm=['ZUNCASS','JANG','VIV PHẠM','VNT','MINTHW','HIỆP HĂNG HÁI','SOY','VICTOR','SYDNEY','MINH KHẨU','KUMA','ALONG'];
  S.players=nm.map((n,i)=>({name:n,dead:[0,5,9].includes(i)?1:0,pov:[3,10].includes(i)?1:0,roles:i===0?['tientri']:i===11?['phongan','soi']:i===4?['phuthuy']:i===7?['baove']:[]})); S.mayor=+Q.get('mayor')||8; S.speak=+Q.get('speak')||3; render(); }
let ws=null, tries=0, pingT=null;
function connect(){ const base=(BASE||location.origin).replace(/^http/,'ws');
  ws=new WebSocket(base+'/api/stage/'+ROOM+'/ws');
  ws.onopen=()=>{ tries=0; clearInterval(pingT); pingT=setInterval(()=>{ try{ ws.send('ping'); }catch(e){} },25000); };
  ws.onmessage=e=>{ if(e.data==='pong') return; try{ onMsg(JSON.parse(e.data)); }catch(err){} };
  ws.onclose=()=>{ clearInterval(pingT); setTimeout(connect,Math.min(15000,1000*2**tries++)); }; }
if(!Q.get('test')) connect();
render();
</script></body></html>
